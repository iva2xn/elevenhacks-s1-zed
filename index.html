<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chinese RPG - Language Learning Adventure</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gameWrapper">
    <div id="missionBar" class="pixel-box">
      <div class="mission-title">Objectives</div>
      <ul id="missionList">
        <li id="objectiveText">Ask someone how to get to the next town</li>
      </ul>
    </div>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="320" height="180"></canvas>
      <div id="uiOverlay"></div>
    </div>
    <div id="dialogContainer"></div>
    <div id="transitionScreen">
      <div id="transitionContent">
        <div id="transitionCity"></div>
        <div id="transitionTime"></div>
        <button id="transitionContinue">Continue</button>
      </div>
    </div>
    <div id="mobileControls">
      <div class="dpad">
        <div class="empty"></div>
        <button class="dpad-btn" data-dir="up">▲</button>
        <div class="empty"></div>
        <button class="dpad-btn" data-dir="left">◄</button>
        <div class="empty"></div>
        <button class="dpad-btn" data-dir="right">►</button>
        <div class="empty"></div>
        <button class="dpad-btn" data-dir="down">▼</button>
        <div class="empty"></div>
      </div>
      <button class="interact-btn">TALK</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
